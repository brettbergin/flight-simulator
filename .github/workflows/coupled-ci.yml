name: Coupled shaft CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coupled-shaft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: coupled-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.5'
      - name: Check all twenty-four independent mathematical tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/coupled-reference-ci
          python -B -m unittest discover -s tests/engine/shaft-method/coupled-midpoint-v1 -p 'test_*.py' -v 2>&1 | tee .local/coupled-reference-ci/selftests.log
      - name: Reproduce immutable independent reference packet
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/engine/shaft-method/coupled-midpoint-v1/generate.py --repo-root . --check tests/engine/shaft-method/coupled-midpoint-v1/references.json 2>&1 | tee .local/coupled-reference-ci/generation.log
          sha256sum tests/engine/shaft-method/coupled-midpoint-v1/references.json > .local/coupled-reference-ci/packet.sha256
          sha256sum tests/engine/shaft-method/coupled-midpoint-v1/generate.py tests/engine/shaft-method/coupled-midpoint-v1/exact.py tests/engine/shaft-method/coupled-midpoint-v1/native_fixture.py > .local/coupled-reference-ci/generator-sources.sha256
      - name: Preserve mathematical evidence including failed generation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coupled-reference-evidence
          if-no-files-found: warn
          path: |
            .local/coupled-reference-ci/*.log
            .local/coupled-reference-ci/*.sha256
