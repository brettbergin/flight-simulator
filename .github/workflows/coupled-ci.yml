name: Coupled shaft CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coupled-shaft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: coupled-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.5'
      - name: Check all twenty-four independent mathematical tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/coupled-reference-ci
          python -B -m unittest discover -s tests/engine/shaft-method/coupled-midpoint-v1 -p 'test_*.py' -v 2>&1 | tee .local/coupled-reference-ci/selftests.log
      - name: Reproduce immutable independent reference packet
        shell: bash
        run: |
          set -euo pipefail
          python -B tests/engine/shaft-method/coupled-midpoint-v1/generate.py --repo-root . --check tests/engine/shaft-method/coupled-midpoint-v1/references.json 2>&1 | tee .local/coupled-reference-ci/generation.log
          sha256sum tests/engine/shaft-method/coupled-midpoint-v1/references.json > .local/coupled-reference-ci/packet.sha256
          sha256sum tests/engine/shaft-method/coupled-midpoint-v1/generate.py tests/engine/shaft-method/coupled-midpoint-v1/exact.py tests/engine/shaft-method/coupled-midpoint-v1/native_fixture.py > .local/coupled-reference-ci/generator-sources.sha256
      - name: Preserve mathematical evidence including failed generation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coupled-reference-evidence
          if-no-files-found: warn
          path: |
            .local/coupled-reference-ci/*.log
            .local/coupled-reference-ci/*.sha256
  coupled-native:
    name: coupled-native (${{ matrix.os }})
    needs: reference
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      JSBSIM_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.5'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked schema validator dependencies
        run: |
          npm ci --ignore-scripts --prefix schemas
          if ($LASTEXITCODE -ne 0) { throw 'Schema dependency installation failed' }
      - name: Pin headless Linux compiler family
        if: runner.os == 'Linux'
        run: |
          'CC=gcc-13' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CXX=g++-13' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check independent mathematical and tamper tests
        run: |
          python -B tests/engine/shaft-method/probes/run.py math
          if ($LASTEXITCODE -ne 0) { throw 'Coupled mathematical or tamper tests failed' }
          python -B -m unittest discover -s tools/ci -p 'test_coupled_native.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'CI qualification guard tests failed' }
      - name: Bind source and unchanged physical budgets before compilation
        run: |
          python -B tools/ci/coupled-native.py pretrial --work-root .local/coupled-ci
          if ($LASTEXITCODE -ne 0) { throw 'Coupled CI identity gate failed' }
      - name: Compile fresh qualified headless modified backend without testing
        run: ./tools/bootstrap/build.ps1 -Python python -PatchedSourceVariant event-aware-coupled-midpoint-v1 -HeadlessNative -ConfigureAndBuildOnly -BuildDirectory .local/coupled-ci/build -SourcePreparationDirectory .local/coupled-ci/prepared-source -PretrialRatification .local/coupled-ci/pretrial.json -ExecutionRatification .local/coupled-ci/physical-execution.json -ProbeExecutionRatification .local/coupled-ci/unit-execution.json
      - name: Explicitly authorize measured isolated unit binaries
        run: |
          python -B tests/engine/shaft-method/probes/run.py authorize --config .local/coupled-ci/build/coupled-probes-config.json --ratification .local/coupled-ci/unit-execution.json --approve-execution
          if ($LASTEXITCODE -ne 0) { throw 'Measured coupled unit authorization failed' }
      - name: Independently qualify actual compiler routes and authorize physical binaries
        run: |
          python -B tools/ci/coupled-native.py authorize --work-root .local/coupled-ci --approve-execution
          if ($LASTEXITCODE -ne 0) { throw 'Coupled CI identity gate failed' }
      - name: Execute full headless CTest with both explicit authorization records
        run: ./tools/bootstrap/build.ps1 -Python python -PatchedSourceVariant event-aware-coupled-midpoint-v1 -HeadlessNative -RunTestsOnly -BuildDirectory .local/coupled-ci/build -SourceBundleRoot .local/coupled-ci/prepared-source/source -PretrialRatification .local/coupled-ci/pretrial.json -ExecutionRatification .local/coupled-ci/physical-execution.json -ProbeExecutionRatification .local/coupled-ci/unit-execution.json
      - name: Verify original twelve-process physical gate and isolated unit results
        run: |
          python -B tools/ci/coupled-native.py verify --work-root .local/coupled-ci
          if ($LASTEXITCODE -ne 0) { throw 'Coupled CI identity gate failed' }
      - name: Preserve headless qualification evidence without simulator binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coupled-shaft-evidence-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            .local/coupled-ci/pretrial.json
            .local/coupled-ci/*-execution.json
            .local/coupled-ci/evidence/*.json
            .local/coupled-ci/build/event-aware-route.json
            .local/coupled-ci/build/event-aware-build-result.json
            .local/coupled-ci/build/CMakeCache.txt
            .local/coupled-ci/build/compile_commands.json
            .local/coupled-ci/build/native-verbose-build.log
            .local/coupled-ci/build/native-ctest.log
            .local/coupled-ci/build/toolchain-build-manifest.txt
            .local/coupled-ci/build/jsbsim-source-build-manifest.txt
            .local/coupled-ci/build/interactive-source-fingerprint.txt
            .local/coupled-ci/build/coupled-probes-config.json
            .local/coupled-ci/build/Testing/Temporary/*.log
            .local/coupled-ci/build/piston-engine-proof/**
            .local/coupled-ci/build/coupled-unit-proof/**
            .local/toolchain/environment.json
