name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked contract validators
        run: npm ci --ignore-scripts --prefix schemas
      - name: Check offline airport source contract
        run: node --test tests/world/resident-airport/source-contract.test.mjs
      - name: Verify frozen resident-grid contract and independent references
        shell: pwsh
        run: |
          $gridPins = @{
            'tests/ground/grid/reference/material-oracles.json' = '1824b250c8a44b80e11802c931e85cb6507315f3b32af3645bef373e47a1c0ad'
            'tests/ground/grid/reference/materials-README.md' = '1b93c759e47ef58d9ae7193333e9b780ee78785ccf3e3551f8dedcc27f9f70a9'
            'docs/contracts/world/terrain-tools-v1.md' = '9a8a2a77b6daeaa15b7d785fb2452b2cd380d3f062acb9845fa038b5e33d96f6'
            'tools/ingest/terrain/tools-v1.lock.json' = 'e2251bd539487ddb8fc46cea698a094fe3081ee63390be6a2941489c93a10999'
            'docs/contracts/world/resident-grid-core-v1.md' = '9e4ef15be255624405b917efce41fbbb7333c89072d586d75a7cfa0d472197df'
            'native/world_core/grid/include/flight/ground/prepared_grid.hpp' = '7b7f7dee3875cf67d9df8057405fc729ec72da4570dfcd5f8a4dca755d6e96f3'
            'tests/ground/grid/reference/reference_producer.py' = '6bccd5b7f3490b29b8ace59ea42acf4f773477730cb9df4b74e31a36d7f31835'
            'tests/ground/grid/reference/source_oracles.json' = '55cb32169a5aa8d07d6008423939e30ae3fa027499f030c162a8e57bac67fc0e'
            'tests/ground/grid/reference/README.md' = '1dcfec7c2eacb0b9ebf048c899966ca8a9881a29fa499a3e17f8c3ebf48c3234'
            'tests/ground/grid/reference/expected-v1.json' = '54a9c451234b37d2d621492c75ec581a0d0f57698bf3bab3d8fbd573b484bd7d'
          }
          foreach ($name in $gridPins.Keys) {
            if ((Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant() -cne $gridPins[$name]) { throw 'Frozen resident-grid reference changed; reviewed successor required' }
          }
          python -I -B tests/ground/grid/reference/reference_producer.py --check tests/ground/grid/reference/expected-v1.json
          if ($LASTEXITCODE -ne 0) { throw 'Independent resident-grid reference reproduction failed' }
      - name: Check recursive simulation staging and drift rejection
        shell: pwsh
        run: ./tools/interactive-preview/simulation-staging.test.ps1
      - name: Verify readonly frozen native-wire binary64 references and table
        shell: pwsh
        run: |
          $referencePins = @{
            'docs/evidence/P2/native-wire-number-reference.py' = '3783367f8bc110c8f4122187083aeef0e7ef8db49ec27c93b2a67732b65430d1'
            'docs/evidence/P2/native-wire-number-reference.json' = '1cab52841eb0cb063d547bf90e7a50f04a1871a5293bdfee4e0a78ddb8940ff6'
          }
          foreach ($name in $referencePins.Keys) {
            if ((Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant() -cne $referencePins[$name]) { throw 'Frozen native-wire reference source changed' }
          }
          python -B docs/evidence/P2/native-wire-number-reference.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Frozen49 native-wire oracle reproduction failed' }
          python -B tests/wire_codec/emit_reference.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Mechanical native-wire table differs from frozen oracle' }
      - name: Verify frozen local-player contract and independent value references
        shell: pwsh
        run: |
          $localPlayerPins = @{
            'docs/contracts/local-players/records-and-lifetimes-v1.md' = 'ed96f42afbb752ea3c400da518fa6ddb226752d552d1e84acc3f8b998a74233a'
            'docs/contracts/local-players/protocol-v1.md' = '4a06cf33f70e86c5e07a389d4660a52fb2aefbd45ddaf51d95c5a5127fa2a4a4'
            'schemas/save/local-players/v1/schema-v1.sql' = 'cbd00b3fe47b400e79635ed901d195abfe133a4131d5001feac8e3eedeb0562f'
            'schemas/save/local-players/v1/preferences-codec-v1.json' = '47711d41be89e233efe3c42e8f2cedd33f729e6e0e2c9a78a6026454022b0538'
            'schemas/save/local-players/v1/schema-binding-v1.json' = '9353c034edafdb1bcc3984452bd9c2d4fcdbf283342e99bb5a5dd2d27792f049'
            'tests/persistence/local_players/reference/expected-v1.json' = '1ffaa82ae54a18dc5c9ec3d6c49760ed3b2d6c27abf77783572c6a9b3902d962'
            'tests/persistence/local_players/reference/generate.py' = 'a695fa0d06a8b91bed3b3117789c09b2fdb3df0e5e0afe7aa4bd9069d63374ed'
            'tests/persistence/local_players/reference/source-binding-v1.json' = '37d551c29b6e14c51f6d0c0ca37893680a57520b06ffa9f2f046919820eeaa95'
            'tests/persistence/local_players/reference/README.md' = '70507f04f9fdaadd5677e5ff5636c9cc30fbacc0bd9de788c0d7f8234635ec72'
            'tests/persistence/local_players/service_reference/expected-v1.json' = '61078c6aea80de7d15b2d0fe8a94a796a24086ea270f64e98fa9074aa8aa7860'
            'tests/persistence/local_players/service_reference/generate.py' = 'ecc26633c8f1569b4d5e854915c371f53aaee558e5bb22f6249d7e8440c86efd'
            'tests/persistence/local_players/service_reference/source-binding-v1.json' = '0e431ecd198388e29ad40e2209327d68aa31c55b7407d1bc914e0f0a3bfb5c4c'
            'tests/persistence/local_players/service_reference/README.md' = 'a6446d658d5d4b8def14cd77e87f2ec3f9c591091b8335b132db94ecdbacb783'
            'tests/persistence/local_players/full_record_reference/generate.py' = '431da3b2c7d752816653e7b78e887f7189b6d2fb548fd40f2c51b3f9d8b686e0'
            'tests/persistence/local_players/full_record_reference/expected-v1.json' = '164aad9b74de33b04a6a69734116eab899dceaf696135137b9963f679968b722'
            'tests/persistence/local_players/full_record_reference/source-binding-v1.json' = 'e8b1cf26e233bb0205a0cc918d8c62376aab9e861c8c7f7f76968811c3e39362'
            'tests/persistence/local_players/full_record_reference/README.md' = 'e2cddabda7cdc6f4677a5830c547be6ac775cccf5f465d2a2bf0b0e7ee51e478'
            'tests/persistence/local_players/full_record_reference/player-summary-v1.json' = '1bb1781e8484ceafc6ce2e3ae421112d71004bdbaae713127c7a31d50f28f2b0'
            'docs/contracts/local-players/full-record-reference-amendment-v1.md' = '876edc5805f8ed9e497eed7e1bd99635d2441db9cd43b891dc4c2937d04ad91c'
            'docs/contracts/local-players/service-lifecycle-amendment-v1.md' = '5c42070514a49b3a2b678cbc039fdc832dfe69a6589969a9b675d1cfc5b83f3f'
            'docs/contracts/local-players/reservation-and-export-spool-v1.md' = 'e16f2c8835144179d5f1ce386e96cdc8c348c88bf09e7e80a0f49ffab712ce47'
            'docs/contracts/local-players/test-scheduler-v1.md' = '9670f0d7d61fcf0d40afc2102eab6047798e6079bb42d47f02a9afa25d215433'
            'tests/persistence/local_players/reservation_reference/expected-v1.json' = '2bbe1ced7a5d30ae1a469eb5da1675779028fceaf9779fb309d78e356b22cd86'
            'tests/persistence/local_players/reservation_reference/generate.py' = 'e9da454d83bf62f6e42a5746d414acc524df0f5616f2b9861cad01f00d274f50'
            'tests/persistence/local_players/reservation_reference/source-binding-v1.json' = 'af4d754440c4630afd09ccd71061868120e92325817c55a3a4e54b2c0bef19ed'
            'tests/persistence/local_players/reservation_reference/README.md' = '03fe9f18d76edb7723687ffc5491e03ebebe7c10df75f20f3b46401c3128e1f7'
            'docs/contracts/local-players/compiled-source-allocation-v1.json' = 'ac04b370a2861213b008680eedb1b62f8a434c61468e2d913c9e05e9a522192a'
            'docs/contracts/local-players/test-capability-v1.md' = 'a0563a3fa5b9bd70146d0da43c5d20fca88cd4916c2fba005befbb432f0730cb'
            'docs/contracts/local-players/recovery-v1.md' = 'd7349a672519a9c7e3d367d5f756adbcc0507a9138b800500805687782f90859'
            'docs/decisions/026-durable-local-players-and-practice-history.md' = '34d2617ff70453b6679df3f9bd388334c39b38f55bd966b27ca975780c251a1b'
            'docs/decisions/027-synthetic-taxi-navigation.md' = 'd3a39710e3cf3ad354ac22c886656c446b3d8612acf58a730513c787c2382e03'
          }
          foreach ($name in $localPlayerPins.Keys) {
            if ((Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant() -cne $localPlayerPins[$name]) { throw 'Frozen local-player input changed; reviewed successor contract required' }
          }
          python -B tests/persistence/local_players/reference/generate.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Independent local-player value reference reproduction failed' }
          python -B tests/persistence/local_players/service_reference/generate.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Independent local-player service reference reproduction failed' }
          python -B tests/persistence/local_players/full_record_reference/generate.py --check --schema-source schemas/save/local-players/v1/schema-v1.sql
          if ($LASTEXITCODE -ne 0) { throw 'Independent local-player full-record reference reproduction failed' }
          python -B tests/persistence/local_players/reservation_reference/generate.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Independent local-player reservation reference reproduction failed' }
      - name: Verify original synthetic taxi source and pose references
        shell: pwsh
        run: |
          $taxiPins = @{
            'content/world/synthetic/taxi-layout-v1.json' = 'd8668af407885949a4eb05fbe170d41fe6c6752d3ce15670f9879a36063d355c'
            'schemas/world/synthetic-taxi-layout-v1.schema.json' = '14d7a2d7836c76d7a1adb5841d153e6c1e06a101992ab94bc4363d50db581a36'
            'docs/decisions/027-synthetic-taxi-navigation.md' = 'd3a39710e3cf3ad354ac22c886656c446b3d8612acf58a730513c787c2382e03'
            'tests/world/taxi/reference/generate.py' = '799fbcc5fc2144e713d295559e961d1614e245b7bf2a003135ce1234eedec558'
            'tests/world/taxi/reference/expected-v1.json' = '9b9579b18c38ba3c1393af76798fa39b8683229fdf2eff553b1c12e0fd3ae37c'
            'tests/world/taxi/reference/source-binding-v1.json' = '1366d0484be3eb6a6ca13028f7f431894d6c879c01dbe2a04f3107a7a7678c8b'
            'tests/world/taxi/reference/README.md' = 'dd070ab6dcfcd45de6c2dd26129b2402c045cc7eb0b5ebfa6dd2a8ceee81df41'
            'tests/world/taxi/start-reference/expected-v1.json' = 'fb543ddd1681c3cb040cdfd1c65ff404eb9409e73bb6f613c225a3a501f2e333'
            'tests/world/taxi/start-reference/generate.py' = 'da0e7b91bd3a3ea7df60f80b01b75df209bc4271950f6458fa462da4efba2645'
            'tests/world/taxi/start-reference/source-binding-v1.json' = '5b097ee7c6b727e0f19fe4079913c1e0c4ad6453de9628d01a9bc9588c08c230'
            'tests/world/taxi/start-reference/README.md' = '4eb067f2cf2d7bae258984704685578a672be0cae697b6af0b1212bca980eeb6'
            'tests/world/taxi/start-reference/prop-disk-v1.json' = '545c0dc04dfa8e5d10eebaef0458dbfb46bb12f53d2d5ab05cf02004bcfe6537'
            'tests/world/taxi/start-reference/generate-prop-disk.py' = 'dd9aa4014416a2871cb13239fc74c29b1ff21c7d6f26e158ff0ad8bfcc02d8ff'
          }
          foreach ($name in $taxiPins.Keys) {
            if ((Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant() -cne $taxiPins[$name]) { throw 'Frozen original taxi source/reference changed; reviewed successor required' }
          }
          python -B tests/world/taxi/reference/generate.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Independent shared taxi content reference differs' }
          python -B tests/world/taxi/start-reference/generate.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Independent apron pose reference differs' }
          python -B tests/world/taxi/start-reference/generate-prop-disk.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Independent physical disk reference differs' }
      - name: Check reconstruction declaration rejection cases
        run: node --test tests/replay/declarations.test.mjs tests/fdm/source-fingerprint.test.mjs
      - name: Check renderer evidence mathematics and integrity
        run: node --test tools/benchmark/reduce.test.mjs tools/benchmark/evidence.test.mjs
      - name: Check original GLB units, bindings and animation corruption cases
        run: python -m unittest discover -s tools/benchmark/pipeline -p test_fixture.py
      - name: Check original piston source closure and corruption cases
        run: python -m unittest discover -s tests/engine -p test_check_model.py
      - name: Recompute historical piston references against archived loader source
        run: python tests/engine/reference/generate.py --check --model-pack tests/engine/reference/loader-rejected-v2-model
      - name: Recompute corrected-loader piston references without a solver
        run: python tests/engine/reference/generate_loader_v1.py --check
      - name: Recompute proposed event-aware shaft references without a solver
        run: python tests/engine/shaft-method/reference-proposed-v1/generate.py --check
      - name: Check separate event-aware source-package provenance and corruption cases
        run: python tests/export/test_source_variant.py
      - name: Bind corrected piston source to independent references
        run: python tests/engine/check_model.py --model-root native/fdm_jsbsim/models/original-piston-prop --reference-packet tests/engine/reference/expected-v3.json
      - name: Check independent reference algebra and metadata
        if: ${{ hashFiles('tests/reference/reference.test.mjs') != '' }}
        run: node --test tests/reference/reference.test.mjs
      - name: Recompute frozen references with independent decimal arithmetic
        if: ${{ hashFiles('tools/validation/derive.py') != '' }}
        run: python tools/validation/derive.py
      - name: Report frozen independent reference comparisons
        if: ${{ hashFiles('tools/validation/runner.mjs') != '' }}
        run: node tools/validation/runner.mjs --output .local/validation/algebra-report.json
      - run: node tools/check-docs.mjs
      - name: Verify rights inventory and notice integrity
        run: node tools/license-audit/audit.mjs
      - name: Test rights audit rejection cases
        run: node tools/license-audit/test.mjs
      - name: Check dependency pins against reviewed rights
        if: ${{ hashFiles('third_party/dependencies.lock.json') != '' }}
        run: node tools/license-audit/audit.mjs --dependency-lock third_party/dependencies.lock.json
      - name: Preview GitHub backlog without mutations
        run: node tools/sync-github.mjs
      - name: Render agent assignments without GitHub access
        run: node tools/agent-prompts.mjs
