name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check recursive simulation staging and drift rejection
        shell: pwsh
        run: ./tools/interactive-preview/simulation-staging.test.ps1
      - name: Verify readonly frozen native-wire binary64 references and table
        shell: pwsh
        run: |
          $referencePins = @{
            'docs/evidence/P2/native-wire-number-reference.py' = '3783367f8bc110c8f4122187083aeef0e7ef8db49ec27c93b2a67732b65430d1'
            'docs/evidence/P2/native-wire-number-reference.json' = '1cab52841eb0cb063d547bf90e7a50f04a1871a5293bdfee4e0a78ddb8940ff6'
          }
          foreach ($name in $referencePins.Keys) {
            if ((Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant() -cne $referencePins[$name]) { throw 'Frozen native-wire reference source changed' }
          }
          python -B docs/evidence/P2/native-wire-number-reference.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Frozen49 native-wire oracle reproduction failed' }
          python -B tests/wire_codec/emit_reference.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Mechanical native-wire table differs from frozen oracle' }
      - name: Verify frozen local-player contract and independent value references
        shell: pwsh
        run: |
          $localPlayerPins = @{
            'docs/contracts/local-players/records-and-lifetimes-v1.md' = 'e29b1a9fc563ae58105a7b99c6ed158ada347cf506a5565e68c8f7a051d322e0'
            'docs/contracts/local-players/protocol-v1.md' = 'd7a5bc7ee7820df6a3ce8addbc72c66b57b86db91355ad18555f53da6c152d36'
            'schemas/save/local-players/v1/schema-v1.sql' = 'cbd00b3fe47b400e79635ed901d195abfe133a4131d5001feac8e3eedeb0562f'
            'schemas/save/local-players/v1/preferences-codec-v1.json' = '47711d41be89e233efe3c42e8f2cedd33f729e6e0e2c9a78a6026454022b0538'
            'schemas/save/local-players/v1/schema-binding-v1.json' = '9353c034edafdb1bcc3984452bd9c2d4fcdbf283342e99bb5a5dd2d27792f049'
            'tests/persistence/local_players/reference/expected-v1.json' = '1ffaa82ae54a18dc5c9ec3d6c49760ed3b2d6c27abf77783572c6a9b3902d962'
            'tests/persistence/local_players/reference/generate.py' = 'a695fa0d06a8b91bed3b3117789c09b2fdb3df0e5e0afe7aa4bd9069d63374ed'
            'tests/persistence/local_players/reference/source-binding-v1.json' = '37d551c29b6e14c51f6d0c0ca37893680a57520b06ffa9f2f046919820eeaa95'
            'tests/persistence/local_players/reference/README.md' = '70507f04f9fdaadd5677e5ff5636c9cc30fbacc0bd9de788c0d7f8234635ec72'
          }
          foreach ($name in $localPlayerPins.Keys) {
            if ((Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant() -cne $localPlayerPins[$name]) { throw 'Frozen local-player input changed; reviewed successor contract required' }
          }
          python -B tests/persistence/local_players/reference/generate.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Independent local-player value reference reproduction failed' }
      - name: Install locked contract validators
        run: npm ci --ignore-scripts --prefix schemas
      - name: Check reconstruction declaration rejection cases
        run: node --test tests/replay/declarations.test.mjs tests/fdm/source-fingerprint.test.mjs
      - name: Check renderer evidence mathematics and integrity
        run: node --test tools/benchmark/reduce.test.mjs tools/benchmark/evidence.test.mjs
      - name: Check original GLB units, bindings and animation corruption cases
        run: python -m unittest discover -s tools/benchmark/pipeline -p test_fixture.py
      - name: Check original piston source closure and corruption cases
        run: python -m unittest discover -s tests/engine -p test_check_model.py
      - name: Recompute historical piston references against archived loader source
        run: python tests/engine/reference/generate.py --check --model-pack tests/engine/reference/loader-rejected-v2-model
      - name: Recompute corrected-loader piston references without a solver
        run: python tests/engine/reference/generate_loader_v1.py --check
      - name: Recompute proposed event-aware shaft references without a solver
        run: python tests/engine/shaft-method/reference-proposed-v1/generate.py --check
      - name: Check separate event-aware source-package provenance and corruption cases
        run: python tests/export/test_source_variant.py
      - name: Bind corrected piston source to independent references
        run: python tests/engine/check_model.py --model-root native/fdm_jsbsim/models/original-piston-prop --reference-packet tests/engine/reference/expected-v3.json
      - name: Check independent reference algebra and metadata
        if: ${{ hashFiles('tests/reference/reference.test.mjs') != '' }}
        run: node --test tests/reference/reference.test.mjs
      - name: Recompute frozen references with independent decimal arithmetic
        if: ${{ hashFiles('tools/validation/derive.py') != '' }}
        run: python tools/validation/derive.py
      - name: Report frozen independent reference comparisons
        if: ${{ hashFiles('tools/validation/runner.mjs') != '' }}
        run: node tools/validation/runner.mjs --output .local/validation/algebra-report.json
      - run: node tools/check-docs.mjs
      - name: Verify rights inventory and notice integrity
        run: node tools/license-audit/audit.mjs
      - name: Test rights audit rejection cases
        run: node tools/license-audit/test.mjs
      - name: Check dependency pins against reviewed rights
        if: ${{ hashFiles('third_party/dependencies.lock.json') != '' }}
        run: node tools/license-audit/audit.mjs --dependency-lock third_party/dependencies.lock.json
      - name: Preview GitHub backlog without mutations
        run: node tools/sync-github.mjs
      - name: Render agent assignments without GitHub access
        run: node tools/agent-prompts.mjs
