name: Native CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.5'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate accepted schemas when contract module is present
        run: |
          if (Test-Path native/sim_core/contracts/CMakeLists.txt) {
            if (-not (Test-Path schemas/package-lock.json) -or -not (Test-Path tests/contracts/schema.test.mjs)) {
              throw "Accepted contract module is missing schema lock/tests"
            }
            npm ci --ignore-scripts --prefix schemas
            if ($LASTEXITCODE -ne 0) { throw "Schema dependency installation failed" }
            npm --prefix schemas run check
            if ($LASTEXITCODE -ne 0) { throw "Schema compilation failed" }
            node --test tests/contracts/schema.test.mjs
            if ($LASTEXITCODE -ne 0) { throw "Schema tests failed" }
          }
      - name: Validate dependency download integrity
        run: python tools/bootstrap/test_bootstrap.py
      - name: Pin headless Linux compiler family
        if: runner.os == 'Linux'
        run: |
          "CC=gcc-13" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=g++-13" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile real shared dependencies, bindings and C++20 smoke
        run: ./tools/bootstrap/build.ps1 -Python python -WithGodot -WithExportTemplates:($IsWindows)
      - name: Verify unchanged source/tool receipts after build
        run: python tools/bootstrap/bootstrap.py --offline --with-godot
      - name: Prove authoritative synthetic dynamics and strict scenario boundaries
        run: |
          node tests/fdm/make-transport-fixture.mjs --check
          if ($LASTEXITCODE -ne 0) { throw "Native transport fixture drift" }
          node --test tests/fdm/frontend.test.mjs tests/fdm/integration.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "FDM wire/context rejection tests failed" }
          node tests/fdm/proof.mjs
          if ($LASTEXITCODE -ne 0) { throw "FDM repeat/convergence/stability proof failed" }
      - name: Prove native initializer loaded in pinned Godot
        run: ./tools/bootstrap/verify-godot.ps1
      - name: Prove original asset import and CPU render-frame geometry
        run: |
          $environment = Get-Content .local/toolchain/environment.json -Raw | ConvertFrom-Json
          python tools/benchmark/pipeline/verify_pipeline.py --godot $environment.tools.godot --output .local/pipeline-proof/ci
          if ($LASTEXITCODE -ne 0) { throw "Actual original GLB import proof failed" }
          python tools/benchmark/geodesy/run.py --godot $environment.tools.godot --output .local/render-geodesy/ci
          if ($LASTEXITCODE -ne 0) { throw "Private render-frame geometry proof failed" }
          python tools/benchmark/verify_headless.py --godot $environment.tools.godot --output .local/render-headless/ci
          if ($LASTEXITCODE -ne 0) { throw "Renderer compilation/headless rejection failed" }
      - name: Check original-model observed equation corpus
        if: hashFiles('tests/reference/observed.mjs') != ''
        run: |
          node tests/reference/observed.mjs .local/fdm-proof/hz120
          if ($LASTEXITCODE -ne 0) { throw "Observed model equation corpus failed" }
      - name: Prove integrated terrain contact authority
        if: hashFiles('tests/ground/proof/verify.test.mjs') != ''
        run: |
          node --test tests/ground/proof/verify.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Ground contact authority proof failed" }
      - name: Prove one-executive ground-to-flight loop and fail-closed boundaries
        run: |
          node --test tests/interactive/verify.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Interactive ground-to-flight repeat, v1 records or boundary checks failed" }
      - name: Prove actual typed native bridge in Godot editor
        run: |
          node tests/export/make-initializer.mjs --check
          if ($LASTEXITCODE -ne 0) { throw "Bridge initializer fixture drift" }
          node --test tests/export/runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Selected runtime rejection tests failed" }
          if ($IsWindows) {
            ./tools/export/proof.ps1 -Python python
          } else {
            ./tools/export/proof.ps1 -EditorOnly -Python python
          }
      - name: Prove Windows corresponding source and actual DLL replacement
        if: runner.os == 'Windows'
        run: |
          python tools/export/source-bundle.py --output .local/export-ci-source
          if ($LASTEXITCODE -ne 0) { throw "Corresponding source generation failed" }
          python tests/export/source-integrity.py .local/export-ci-source/source
          if ($LASTEXITCODE -ne 0) { throw "Corresponding source negative tests failed" }
          $source = Get-Content .local/export-ci-source/source-bundle-evidence.json -Raw | ConvertFrom-Json
          $registry = Get-Content third_party/licenses/register.json -Raw | ConvertFrom-Json
          $expected = ($registry.entries | Where-Object id -eq 'jsbsim').library_policy.source_archive_sha256
          if ($source.source_archive_sha256 -ne $expected) { throw "Corresponding source does not match reviewed archive pin" }
          ./tools/export/replacement.ps1 -SourceArchive .local/export-ci-source/jsbsim-1.3.1-library-source.zip -SourceSHA256 $expected -Python python
          node tools/export/package.mjs .local/export-ci-source
          if ($LASTEXITCODE -ne 0) { throw "Package selected-runtime/rights audit failed; unknown hosted CRT identities require review" }
      - name: Prove human-controlled Windows preview in editor and portable export
        if: runner.os == 'Windows'
        run: |
          $proof = Get-Content .local/export-proof/latest-run.json -Raw | ConvertFrom-Json
          ./tools/preview/run.ps1 -ExportProofRoot $proof.root -ToolchainRoot .local/toolchain
      - name: Preserve build evidence (no simulator binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-evidence-${{ matrix.os }}
          if-no-files-found: error
          path: |
            .local/build/native-release/toolchain-build-manifest.txt
            .local/build/native-release/Testing/Temporary/LastTest.log
            .local/toolchain/environment.json
            .local/build/native-release/dynamic-dependencies.txt
            .local/build/native-release/godot-binding-load.txt
            .local/fdm-proof/**
            .local/export-proof/**/evidence/**
            .local/build/native-release/replay-proof/**
            .local/validation/observed-report.json
            .local/ground-proof/**
            .local/interactive-proof/**
            .local/pipeline-proof/ci/**
            .local/render-geodesy/ci/**
            .local/render-headless/ci/**
            .local/preview/run-*/evidence/*.json
            .local/preview/run-*/evidence/*.log
