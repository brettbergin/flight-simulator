name: Bug report
description: A reproducible simulator or tooling defect
labels: ['bug', 'type:bug']
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include build/content version, aircraft configuration, scenario seed, assists, and steps. Attach a scrubbed replay if available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Windows version, GPU/driver, controls/calibration, frame rates, logs without personal data, and actual result.
    validations:
      required: true
